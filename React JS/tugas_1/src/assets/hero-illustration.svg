<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background decorative blobs -->
  <rect width="600" height="420" fill="url(#bgGrad)" rx="24"/>
  <circle cx="520" cy="80" r="70" fill="#38bdf8" opacity="0.25" filter="blur(20px)"/>
  <circle cx="90" cy="340" r="90" fill="#6366f1" opacity="0.2" filter="blur(30px)"/>

  <!-- Main IDE / Browser Window -->
  <g filter="url(#dropShadow)">
    <rect x="60" y="50" width="480" height="310" rx="16" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Window Header -->
    <path d="M 60 66 Q 60 50 76 50 L 524 50 Q 540 50 540 66 L 540 92 L 60 92 Z" fill="#1e293b"/>
    <circle cx="85" cy="71" r="5" fill="#ef4444"/>
    <circle cx="102" cy="71" r="5" fill="#f59e0b"/>
    <circle cx="119" cy="71" r="5" fill="#10b981"/>
    
    <!-- Tab bar -->
    <rect x="150" y="58" width="130" height="26" rx="6" fill="#334155"/>
    <text x="175" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">App.jsx</text>
    <circle cx="163" cy="71" r="3" fill="#61dafb"/>

    <!-- URL / Search Bar -->
    <rect x="300" y="60" width="220" height="22" rx="11" fill="#0f172a"/>
    <text x="320" y="75" fill="#64748b" font-family="monospace" font-size="10">localhost:5173/react-app</text>
  </g>

  <!-- Window Content: Split View (Code on Left, UI Preview on Right) -->
  <!-- Left Side: Code Editor -->
  <rect x="80" y="110" width="210" height="230" rx="10" fill="#0f172a"/>
  <!-- Code lines -->
  <text x="96" y="136" fill="#f43f5e" font-family="monospace" font-size="11">import <tspan fill="#e2e8f0">React</tspan> from <tspan fill="#38bdf8">'react'</tspan></text>
  <text x="96" y="156" fill="#818cf8" font-family="monospace" font-size="11">function <tspan fill="#38bdf8">App</tspan>() {</text>
  <text x="110" y="176" fill="#f43f5e" font-family="monospace" font-size="11">  return (</text>
  <text x="124" y="196" fill="#fbbf24" font-family="monospace" font-size="11">    &lt;<tspan fill="#38bdf8">Navbar</tspan> /&gt;</text>
  <text x="124" y="216" fill="#fbbf24" font-family="monospace" font-size="11">    &lt;<tspan fill="#38bdf8">Home</tspan> /&gt;</text>
  <text x="124" y="236" fill="#fbbf24" font-family="monospace" font-size="11">    &lt;<tspan fill="#38bdf8">Team</tspan> /&gt;</text>
  <text x="124" y="256" fill="#fbbf24" font-family="monospace" font-size="11">    &lt;<tspan fill="#38bdf8">Contact</tspan> /&gt;</text>
  <text x="110" y="276" fill="#f43f5e" font-family="monospace" font-size="11">  )</text>
  <text x="96" y="296" fill="#818cf8" font-family="monospace" font-size="11">}</text>
  <text x="96" y="320" fill="#22c55e" font-family="monospace" font-size="10">// Powered by React 19 + Vite</text>

  <!-- Right Side: UI Preview Mockup -->
  <g transform="translate(305, 110)">
    <!-- Hero preview card -->
    <rect x="0" y="0" width="215" height="110" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="14" y="16" width="110" height="12" rx="4" fill="#1e40af"/>
    <rect x="14" y="35" width="180" height="8" rx="3" fill="#93c5fd"/>
    <rect x="14" y="48" width="140" height="8" rx="3" fill="#cbd5e1"/>
    <!-- Button -->
    <rect x="14" y="68" width="70" height="24" rx="6" fill="#2563eb"/>
    <text x="28" y="84" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Mulai</text>

    <!-- Component Cards Row -->
    <rect x="0" y="125" width="65" height="105" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="32" cy="150" r="14" fill="#dbeafe"/>
    <rect x="10" y="174" width="45" height="6" rx="2" fill="#1e293b"/>
    <rect x="12" y="186" width="41" height="4" rx="2" fill="#94a3b8"/>
    <rect x="12" y="194" width="35" height="4" rx="2" fill="#cbd5e1"/>

    <rect x="75" y="125" width="65" height="105" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="107" cy="150" r="14" fill="#e0e7ff"/>
    <rect x="85" y="174" width="45" height="6" rx="2" fill="#1e293b"/>
    <rect x="87" y="186" width="41" height="4" rx="2" fill="#94a3b8"/>
    <rect x="87" y="194" width="35" height="4" rx="2" fill="#cbd5e1"/>

    <rect x="150" y="125" width="65" height="105" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="182" cy="150" r="14" fill="#ccfbf1"/>
    <rect x="160" y="174" width="45" height="6" rx="2" fill="#1e293b"/>
    <rect x="162" y="186" width="41" height="4" rx="2" fill="#94a3b8"/>
    <rect x="162" y="194" width="35" height="4" rx="2" fill="#cbd5e1"/>
  </g>

  <!-- Floating React Badge on Bottom Right -->
  <g transform="translate(470, 275)" filter="url(#dropShadow)">
    <circle cx="36" cy="36" r="34" fill="#0f172a" stroke="#00d8ff" stroke-width="2.5"/>
    <!-- React Atom Icon -->
    <ellipse cx="36" cy="36" rx="22" ry="8" fill="none" stroke="#00d8ff" stroke-width="2" transform="rotate(0 36 36)"/>
    <ellipse cx="36" cy="36" rx="22" ry="8" fill="none" stroke="#00d8ff" stroke-width="2" transform="rotate(60 36 36)"/>
    <ellipse cx="36" cy="36" rx="22" ry="8" fill="none" stroke="#00d8ff" stroke-width="2" transform="rotate(120 36 36)"/>
    <circle cx="36" cy="36" r="3.5" fill="#00d8ff"/>
  </g>

  <!-- Floating Bootstrap Badge on Top Left -->
  <g transform="translate(30, 40)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="54" height="54" rx="14" fill="#7952b3" stroke="#ffffff" stroke-width="2.5"/>
    <text x="27" y="38" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="bold" text-anchor="middle">B</text>
  </g>
</svg>
