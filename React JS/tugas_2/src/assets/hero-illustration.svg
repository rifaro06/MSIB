<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="100%" height="100%">
  <defs>
    <linearGradient id="studioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ambient light blobs -->
  <circle cx="560" cy="110" r="120" fill="#8b5cf6" opacity="0.25" filter="url(#glowFilter)"/>
  <circle cx="120" cy="380" r="140" fill="#06b6d4" opacity="0.2" filter="url(#glowFilter)"/>
  <circle cx="480" cy="400" r="100" fill="#ec4899" opacity="0.15" filter="url(#glowFilter)"/>

  <!-- Main Floating Glass Studio Canvas -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="40" width="580" height="360" rx="20" fill="url(#panelGrad)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5"/>

    <!-- Window Top Bar -->
    <path d="M 50 60 Q 50 40 70 40 L 610 40 Q 630 40 630 60 L 630 84 L 50 84 Z" fill="#0b0f19"/>
    <circle cx="75" cy="62" r="5" fill="#f43f5e"/>
    <circle cx="92" cy="62" r="5" fill="#fbbf24"/>
    <circle cx="109" cy="62" r="5" fill="#10b981"/>

    <!-- Title / Breadcrumb in Top Bar -->
    <text x="140" y="66" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">LUMINA STUDIO &#8226; Digital Architecture &amp; UI Workspace</text>
    <rect x="470" y="52" width="140" height="20" rx="10" fill="rgba(255,255,255,0.06)"/>
    <text x="505" y="66" fill="#38bdf8" font-family="monospace" font-size="10">v2.4 &#8226; LIVE</text>
    <circle cx="490" cy="62" r="3" fill="#22c55e"/>
  </g>

  <!-- Left Sidebar inside window -->
  <rect x="68" y="100" width="130" height="280" rx="12" fill="#090d16" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <!-- Sidebar icons / nav items -->
  <rect x="80" y="118" width="106" height="32" rx="8" fill="rgba(99, 102, 241, 0.25)" stroke="rgba(99, 102, 241, 0.5)"/>
  <circle cx="96" cy="134" r="6" fill="#818cf8"/>
  <text x="110" y="138" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">Dashboard</text>

  <rect x="80" y="160" width="106" height="28" rx="6" fill="rgba(255,255,255,0.03)"/>
  <circle cx="96" cy="174" r="5" fill="#64748b"/>
  <text x="110" y="178" fill="#94a3b8" font-family="sans-serif" font-size="10">Projects</text>

  <rect x="80" y="196" width="106" height="28" rx="6" fill="rgba(255,255,255,0.03)"/>
  <circle cx="96" cy="210" r="5" fill="#64748b"/>
  <text x="110" y="214" fill="#94a3b8" font-family="sans-serif" font-size="10">Analytics</text>

  <rect x="80" y="232" width="106" height="28" rx="6" fill="rgba(255,255,255,0.03)"/>
  <circle cx="96" cy="246" r="5" fill="#64748b"/>
  <text x="110" y="250" fill="#94a3b8" font-family="sans-serif" font-size="10">Components</text>

  <!-- Center-Right: Interactive Showcase Cards -->
  <!-- Top Stats Row -->
  <g transform="translate(215, 100)">
    <!-- Stat card 1 -->
    <rect x="0" y="0" width="125" height="72" rx="12" fill="#0b0f19" stroke="rgba(99,102,241,0.3)"/>
    <text x="14" y="24" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600">RENDER SPEED</text>
    <text x="14" y="52" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="800">42ms</text>
    <rect x="75" y="40" width="40" height="14" rx="4" fill="rgba(34,197,94,0.2)"/>
    <text x="80" y="51" fill="#4ade80" font-family="sans-serif" font-size="9" font-weight="bold">+99.4%</text>

    <!-- Stat card 2 -->
    <rect x="138" y="0" width="125" height="72" rx="12" fill="#0b0f19" stroke="rgba(236,72,153,0.3)"/>
    <text x="152" y="24" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600">CLIENT CSAT</text>
    <text x="152" y="52" fill="#ec4899" font-family="sans-serif" font-size="20" font-weight="800">99.8%</text>
    <circle cx="242" cy="48" r="8" fill="rgba(236,72,153,0.2)"/>

    <!-- Stat card 3 -->
    <rect x="276" y="0" width="125" height="72" rx="12" fill="#0b0f19" stroke="rgba(16,185,129,0.3)"/>
    <text x="290" y="24" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600">ACTIVE APPS</text>
    <text x="290" y="52" fill="#34d399" font-family="sans-serif" font-size="20" font-weight="800">120+</text>
  </g>

  <!-- Big Interactive Code / Visual Graph Panel -->
  <g transform="translate(215, 185)">
    <rect x="0" y="0" width="401" height="195" rx="14" fill="#090d16" stroke="rgba(255,255,255,0.08)"/>
    
    <!-- Code Editor snippet -->
    <rect x="16" y="16" width="195" height="162" rx="10" fill="#020617"/>
    <circle cx="28" cy="28" r="3" fill="#ec4899"/>
    <circle cx="38" cy="28" r="3" fill="#eab308"/>
    <circle cx="48" cy="28" r="3" fill="#22c55e"/>
    <text x="24" y="50" fill="#f43f5e" font-family="monospace" font-size="10">const <tspan fill="#38bdf8">Lumina</tspan> = {</text>
    <text x="32" y="68" fill="#c084fc" font-family="monospace" font-size="10">  theme: <tspan fill="#a7f3d0">'Dark Glass'</tspan>,</text>
    <text x="32" y="86" fill="#c084fc" font-family="monospace" font-size="10">  framework: <tspan fill="#a7f3d0">'React 19'</tspan>,</text>
    <text x="32" y="104" fill="#c084fc" font-family="monospace" font-size="10">  speed: <tspan fill="#fbbf24">'Ultra'</tspan>,</text>
    <text x="32" y="122" fill="#c084fc" font-family="monospace" font-size="10">  status: <tspan fill="#4ade80">'Ready'</tspan></text>
    <text x="24" y="140" fill="#f43f5e" font-family="monospace" font-size="10">};</text>
    <text x="24" y="160" fill="#64748b" font-family="monospace" font-size="9">// Crafted with passion</text>

    <!-- Visual Chart / Component Preview -->
    <rect x="225" y="16" width="160" height="162" rx="10" fill="#0b0f19" stroke="rgba(139,92,246,0.2)"/>
    <text x="240" y="38" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="700">Digital Growth</text>
    
    <!-- Wave / Spline Graphic -->
    <path d="M 238 120 C 260 110, 275 140, 295 90 C 315 50, 335 110, 350 75 L 372 65" fill="none" stroke="url(#neonGlow)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="372" cy="65" r="5" fill="#06b6d4" filter="url(#glowFilter)"/>
    <circle cx="295" cy="90" r="4" fill="#ec4899"/>
    
    <!-- Glow Bars -->
    <rect x="240" y="145" width="22" height="20" rx="4" fill="#6366f1"/>
    <rect x="270" y="135" width="22" height="30" rx="4" fill="#8b5cf6"/>
    <rect x="300" y="120" width="22" height="45" rx="4" fill="#ec4899"/>
    <rect x="330" y="105" width="22" height="60" rx="4" fill="#06b6d4"/>
    <rect x="360" y="90" width="22" height="75" rx="4" fill="#10b981"/>
  </g>

  <!-- Floating React 19 Hologram Emblem (Bottom Right) -->
  <g transform="translate(560, 340)" filter="url(#cardShadow)">
    <circle cx="38" cy="38" r="36" fill="#090d16" stroke="#00d8ff" stroke-width="2"/>
    <ellipse cx="38" cy="38" rx="24" ry="9" fill="none" stroke="#00d8ff" stroke-width="2" transform="rotate(0 38 38)"/>
    <ellipse cx="38" cy="38" rx="24" ry="9" fill="none" stroke="#00d8ff" stroke-width="2" transform="rotate(60 38 38)"/>
    <ellipse cx="38" cy="38" rx="24" ry="9" fill="none" stroke="#00d8ff" stroke-width="2" transform="rotate(120 38 38)"/>
    <circle cx="38" cy="38" r="4" fill="#00d8ff"/>
  </g>

  <!-- Floating Creative Sparkle Badge (Top Left) -->
  <g transform="translate(20, 20)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="url(#neonGlow)"/>
    <path d="M 28 14 L 31 24 L 41 27 L 31 30 L 28 40 L 25 30 L 15 27 L 25 24 Z" fill="#ffffff"/>
  </g>
</svg>
