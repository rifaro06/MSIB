<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesona Nusantara</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <iframe
            class="header"
            src="header.html"
            title="Header">
        </iframe>


        <!-- Navigation -->
        <iframe
            class="menu"
            src="menu.html"
            title="Menu Navigasi">
        </iframe>


        <!-- Layout utama -->
        <div class="content">

            <!-- Sidebar kiri -->
            <iframe
                class="left"
                src="left.html"
                title="Sidebar Kiri">
            </iframe>


            <!-- Konten utama -->
            <iframe
                class="main"
                src="home.html"
                name="content"
                title="Konten Utama">
            </iframe>


            <!-- Sidebar kanan -->
            <iframe
                class="right"
                src="right.html"
                title="Sidebar Kanan">
            </iframe>

        </div>


        <!-- Footer -->
        <iframe
            class="footer"
            src="footer.html"
            title="Footer">
        </iframe>

    </div>

</body>
</html>
