<!DOCTYPE html>
<html lang="id">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-white p-4">
    <div class="container-fluid d-flex justify-content-center align-items-center" style="min-height: 400px;">
        <div class="card border-0 shadow-sm rounded-4 p-4"
            style="width: 100%; max-width: 380px; background-color: #f8f9fa;">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2"
                    style="width: 50px; height: 50px;">
                    <i class="fas fa-lock fs-4"></i>
                </div>
                <h5 class="fw-bold text-dark m-0">Login Student</h5>
                <small class="text-muted">Akses Dashboard Riez Rafa</small>
            </div>
            <form>
                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold text-muted">Email / NIM</label>
                    <input type="email" class="form-control rounded-3" id="email" placeholder="riez@nurulfikri.ac.id"
                        required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label small fw-semibold text-muted">Password</label>
                    <input type="password" class="form-control rounded-3" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-3 py-2 fw-semibold">
                    <i class="fas fa-sign-in-alt me-1"></i> Masuk
                </button>
            </form>
        </div>
    </div>
</body>

</html>
