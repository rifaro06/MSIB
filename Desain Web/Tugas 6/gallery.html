<!DOCTYPE html>
<html lang="id">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-white p-4">
    <div class="container-fluid">
        <div class="border-bottom pb-3 mb-4">
            <h4 class="fw-bold text-primary m-0"><i class="fas fa-images me-2"></i>Galeri Kegiatan</h4>
        </div>

        <div class="row g-3">
            <!-- KEGIATAN 1: KAMPUS -->
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-3 overflow-hidden h-100">
                    <img src="images/kegiatan/kegiatan1.png" class="card-img-top object-fit-cover" alt="Kegiatan Kampus"
                        style="height: 180px;" onerror="this.onerror=null; this.src='images/kegiatan1.jpg';">
                    <div class="card-body p-3 text-center">
                        <span class="badge bg-primary mb-2"><i class="fas fa-university me-1"></i> Akademik</span>
                        <h6 class="fw-bold mb-1">Kegiatan Kampus</h6>
                        <small class="text-muted">STT Terpadu Nurul Fikri</small>
                    </div>
                </div>
            </div>

            <!-- KEGIATAN 2: PELATIHAN FOODPRENEUR -->
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-3 overflow-hidden h-100">
                    <img src="images/kegiatan/kegiatan2.png" class="card-img-top object-fit-cover"
                        alt="Pelatihan Foodpreneur" style="height: 180px;"
                        onerror="this.onerror=null; this.src='images/kegiatan2.jpg';">
                    <div class="card-body p-3 text-center">
                        <span class="badge bg-success mb-2"><i class="fas fa-utensils me-1"></i> Kewirausahaan</span>
                        <h6 class="fw-bold mb-1">Pelatihan Foodpreneur</h6>
                        <small class="text-muted">Pengembangan Bisnis Kuliner</small>
                    </div>
                </div>
            </div>

            <!-- KEGIATAN 3: PELATIHAN ANDROID DEVELOPER -->
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-3 overflow-hidden h-100">
                    <img src="images/kegiatan/kegiatan3.png" class="card-img-top object-fit-cover"
                        alt="Pelatihan Android Developer" style="height: 180px;"
                        onerror="this.onerror=null; this.src='images/kegiatan3.jpg';">
                    <div class="card-body p-3 text-center">
                        <span class="badge bg-danger mb-2"><i class="fab fa-android me-1"></i> Mobile Dev</span>
                        <h6 class="fw-bold mb-1">Pelatihan Android Developer</h6>
                        <small class="text-muted">Pengembangan Aplikasi Mobile</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
