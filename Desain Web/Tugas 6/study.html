<!DOCTYPE html>
<html lang="id">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-white p-4">
    <div class="container-fluid">
        <div class="border-bottom pb-3 mb-4">
            <h4 class="fw-bold text-primary m-0"><i class="fas fa-graduation-cap me-2"></i>Riwayat Pendidikan</h4>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle border text-center shadow-sm rounded-3 overflow-hidden">
                <thead class="table-dark">
                    <tr>
                        <th>Tingkat</th>
                        <th>Nama Instansi / Sekolah</th>
                        <th>Jurusan</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><span class="badge bg-secondary">SMK</span></td>
                        <td class="fw-semibold">SMK Bina Ikhwani</td>
                        <td>OTKP (Otomatisasi & Tata Kelola Perkantoran)</td>
                        <td><span class="badge bg-success">Lulus</span></td>
                    </tr>
                    <tr>
                        <td><span class="badge bg-primary">S1</span></td>
                        <td class="fw-semibold">STT Terpadu Nurul Fikri</td>
                        <td>Teknik Informatika</td>
                        <td><span class="badge bg-warning text-dark">Aktif Mahasiswa</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
