<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Tugas 2 - JavaScript</title>
</head>

<body>

    <h1>Data Pegawai</h1>

    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Nama Pegawai</th>
                <th>Umur</th>
                <th>Jabatan</th>
                <th>Status</th>
                <th>Gaji Pokok</th>
                <th>Tunjangan Jabatan</th>
                <th>BPJS</th>
                <th>Tunjangan Keluarga</th>
                <th>Total Gaji</th>
            </tr>
        </thead>

        <tbody>
            <script>
                // Data pegawai
                let nama = "Dodi Prayodi";
                let umur = 25;
                let jabatan = "Manajer";
                let status = "Menikah";

                // Menentukan gaji pokok berdasarkan jabatan
                let gajiPokok;

                if (jabatan == "Manajer") {
                    gajiPokok = 15000000;
                } else if (jabatan == "Asisten Manajer") {
                    gajiPokok = 10000000;
                } else if (jabatan == "Staff") {
                    gajiPokok = 5000000;
                }

                // Menghitung tunjangan jabatan sebesar 15% dari gaji pokok
                let tunjanganJabatan = gajiPokok * 0.15;

                // Menghitung BPJS sebesar 10% dari gaji pokok
                let bpjs = gajiPokok * 0.10;

                // Menghitung tunjangan keluarga menggunakan ternary
                let tunjanganKeluarga = status == "Menikah"
                    ? gajiPokok * 0.20
                    : 0;

                // Menghitung total gaji
                let totalGaji = gajiPokok
                    + tunjanganJabatan
                    + bpjs
                    + tunjanganKeluarga;

                // Menampilkan data pegawai ke dalam tabel
                document.write("<tr>");
                document.write("<td>" + nama + "</td>");
                document.write("<td>" + umur + " tahun</td>");
                document.write("<td>" + jabatan + "</td>");
                document.write("<td>" + status + "</td>");
                document.write("<td>Rp " + gajiPokok.toLocaleString("id-ID") + "</td>");
                document.write("<td>Rp " + tunjanganJabatan.toLocaleString("id-ID") + "</td>");
                document.write("<td>Rp " + bpjs.toLocaleString("id-ID") + "</td>");
                document.write("<td>Rp " + tunjanganKeluarga.toLocaleString("id-ID") + "</td>");
                document.write("<td>Rp " + totalGaji.toLocaleString("id-ID") + "</td>");
                document.write("</tr>");
            </script>
        </tbody>

        <tfoot>
            <tr>
                <th colspan="8">Total Gaji</th>
                <th>
                    <script>
                        document.write(
                            "Rp " + totalGaji.toLocaleString("id-ID")
                        );
                    </script>
                </th>
            </tr>
        </tfoot>
    </table>

</body>

</html>
