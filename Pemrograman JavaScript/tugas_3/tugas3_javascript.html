<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tugas Pertemuan 3 JS</title>
</head>
<body>

    <h1>Manajemen Produk Toko</h1>

    <script>
        // Array untuk menyimpan daftar produk toko
        let produkToko = [
            { id: 1, nama: "Laptop", harga: 7000000, stok: 3 },
            { id: 2, nama: "Mouse", harga: 200000, stok: 10 },
            { id: 3, nama: "Keyboard", harga: 350000, stok: 7 }
        ];


        // Fungsi untuk menambahkan produk baru ke dalam array
        function tambahProduk(nama, harga, stok) {
            let idBaru = produkToko.length + 1;

            let produkBaru = {
                id: idBaru,
                nama: nama,
                harga: harga,
                stok: stok
            };

            produkToko.push(produkBaru);
        }


        // Fungsi untuk menghapus produk berdasarkan id
        function hapusProduk(id) {
            produkToko = produkToko.filter(function(produk) {
                return produk.id !== id;
            });
        }


        // Menambahkan produk baru
        tambahProduk("Headset", 500000, 5);


        // Menampilkan daftar produk
        document.write("<h2>Daftar Produk</h2>");

        document.write("<table border='1' cellpadding='8' cellspacing='0'>");
        document.write("<tr>");
        document.write("<th>ID</th>");
        document.write("<th>Nama Produk</th>");
        document.write("<th>Harga</th>");
        document.write("<th>Stok</th>");
        document.write("</tr>");

        produkToko.forEach(function(produk) {
            document.write("<tr>");
            document.write("<td>" + produk.id + "</td>");
            document.write("<td>" + produk.nama + "</td>");
            document.write("<td>Rp " + produk.harga.toLocaleString("id-ID") + "</td>");
            document.write("<td>" + produk.stok + "</td>");
            document.write("</tr>");
        });

        document.write("</table>");
    </script>

</body>
</html>
