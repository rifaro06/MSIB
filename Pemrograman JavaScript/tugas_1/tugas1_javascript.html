<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Tugas 1 - JavaScript</title>
</head>

<body>

    <h1>Menghitung Luas Bangun Datar</h1>

    <script>
        // Menghitung luas persegi panjang
        let panjang = 10;
        let lebar = 5;
        let luasPersegiPanjang = panjang * lebar;

        document.write("<h2>1. Persegi Panjang</h2>");
        document.write("Panjang = " + panjang + "<br>");
        document.write("Lebar = " + lebar + "<br>");
        document.write("Luas = " + luasPersegiPanjang + "<br>");


        // Menghitung luas bujur sangkar
        let sisi = 6;
        let luasBujurSangkar = sisi * sisi;

        document.write("<h2>2. Bujur Sangkar</h2>");
        document.write("Sisi = " + sisi + "<br>");
        document.write("Luas = " + luasBujurSangkar + "<br>");


        // Menghitung luas segitiga
        let alas = 8;
        let tinggi = 6;
        let luasSegitiga = 0.5 * alas * tinggi;

        document.write("<h2>3. Segitiga</h2>");
        document.write("Alas = " + alas + "<br>");
        document.write("Tinggi = " + tinggi + "<br>");
        document.write("Luas = " + luasSegitiga + "<br>");
    </script>

</body>

</html>
